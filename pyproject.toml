[project]
name = "my-nanochat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "numpy>=2.0",
    "tiktoken>=0.12",
    "zstandard>=0.23",
]

[dependency-groups]
dev = ["pytest>=8.0", "pyrefly==1.3.2"]
remote = ["paramiko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires CUDA BF16"]

# 国内镜像：清华 PyPI（含 torch/torchvision）
# 说明：官方 cu130 目录在国内镜像上往往不完整/不可达，故统一走 PyPI 镜像。
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 备用：阿里云 PyPI（若清华不通，可把上面 default 改到这个）
# [[tool.uv.index]]
# name = "aliyun"
# url = "https://mirrors.aliyun.com/pypi/simple"
# default = true

[tool.black]
line-length = 120
target-version = ["py312"]
